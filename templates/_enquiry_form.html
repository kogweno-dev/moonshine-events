<form method="post" class="form" novalidate>
  {% csrf_token %}
  <input type="hidden" name="form_name" value="enquiry">
  {% if form.errors %}<p class="msg msg-error">Please check the fields marked below.</p>{% endif %}
  <div class="grid-2">
    {% for f in form %}
      <div class="field {% if f.name == 'message' or f.name == 'catering_package' %}full{% endif %}">
        <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} *{% endif %}</label>
        {{ f }}
        {% for e in f.errors %}<span class="err">{{ e }}</span>{% endfor %}
      </div>
    {% endfor %}
  </div>
  <button class="btn btn-gold" type="submit">Send my enquiry</button>
  <p class="fine">We reply the same working day. Your details are used only to prepare your quotation.</p>
</form>
